name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows is a first-class target for a BetterDiscord plugin, and it is
    # where a CRLF checkout or a path-handling slip shows up first.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # `pretest` builds the bundle that the smoke test loads.
      - run: npm test
      # dist/*.plugin.js is committed so it can be installed without Node.
      # That artifact goes stale silently, so one job checks it is current.
      - name: Committed plugin matches the source
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: git diff --exit-code -- dist/
